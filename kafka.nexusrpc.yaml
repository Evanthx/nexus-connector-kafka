nexusrpc: "1.0.0"
$schema: https://json-schema.org/draft/2020-12/schema

services:
  KafkaService:
    fqn: KafkaService
    x-go-name: KafkaService
    description: "Reads from and writes to the connector's Kafka topic. Served by the nexusworker."
    operations:
      read:
        fqn: read
        description: "Acknowledge the previous batch, if given, then read the next batch for a consumer group."
        input:
          $ref: "#/$defs/ReadInput"
        output:
          $ref: "#/$defs/ReadOutput"
      write:
        fqn: write
        description: "Write messages to the topic."
        input:
          $ref: "#/$defs/WriteInput"
        output:
          $ref: "#/$defs/WriteOutput"

  KafkaMessageReceiver:
    fqn: KafkaMessageReceiver
    x-go-name: KafkaMessageReceiver
    description: "The service the streamer delivers messages to. Implement it to receive the topic's messages."
    operations:
      receive:
        fqn: receive
        description: "Receive a batch of messages from one partition of the topic."
        input:
          $ref: "#/$defs/ReceiveInput"
        output:
          $ref: "#/$defs/ReceiveOutput"

$defs:
  Record:
    type: object
    description: "A message read from Kafka."
    properties:
      topic:
        type: string
      partition:
        type: integer
      offset:
        type: integer
        description: "Together with topic and partition, identifies the message"
      timestamp:
        type: string
        description: "When the message was written, in RFC 3339 format"
      key:
        type: string
        contentEncoding: base64
        description: "Message key; absent if the message has none"
      value:
        type: string
        contentEncoding: base64
        description: "Message value; empty for a tombstone"
      tombstone:
        type: boolean
        description: "True if the message has no value at all (null in Kafka), as when it deletes its key from a compacted topic. An empty value is not a tombstone"
      headers:
        type: array
        items:
          $ref: "#/$defs/Header"
    required: [topic, partition, offset, timestamp, value, tombstone]
    additionalProperties: false

  Header:
    type: object
    properties:
      key:
        type: string
      value:
        type: string
        contentEncoding: base64
    required: [key, value]
    additionalProperties: false

  ReadInput:
    type: object
    properties:
      group:
        type: string
        minLength: 1
        description: "Consumer group whose committed offsets mark where reading continues. Use one reader per group, and not a group any application consumes from live"
      batchSize:
        type: integer
        minimum: 0
        maximum: 10000
        default: 100
        description: "Most messages to return. 0 only acknowledges"
      timeLimitSeconds:
        type: integer
        minimum: 0
        maximum: 600
        default: 0
        description: "How long to wait for the batch to fill. 0 returns at once with the messages already in the topic"
      ack:
        type: string
        description: "The position from the previous read of this group. It is committed before reading, so the batch it ends is not returned again"
    required: [group]
    additionalProperties: false

  ReadOutput:
    type: object
    properties:
      records:
        type: array
        items:
          $ref: "#/$defs/Record"
      position:
        type: string
        description: "Pass as ack on the next read, once these records are processed"
    required: [records, position]
    additionalProperties: false

  WriteInput:
    type: object
    properties:
      messages:
        type: array
        minItems: 1
        maxItems: 10000
        items:
          $ref: "#/$defs/Message"
    required: [messages]
    additionalProperties: false

  Message:
    type: object
    description: "A message to write."
    properties:
      key:
        type: string
        contentEncoding: base64
      value:
        type: string
        contentEncoding: base64
      headers:
        type: array
        items:
          $ref: "#/$defs/Header"
    required: [value]
    additionalProperties: false

  WriteOutput:
    type: object
    properties:
      written:
        type: integer
    required: [written]
    additionalProperties: false

  ReceiveInput:
    type: object
    description: "Messages from one partition, in offset order."
    properties:
      records:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/Record"
    required: [records]
    additionalProperties: false

  ReceiveOutput:
    type: object
    description: "Empty: the streamer does not wait for a result."
    properties: {}
    additionalProperties: false
